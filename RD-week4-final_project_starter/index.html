<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonders of Nature</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="top">Wonders of Nature</h1>
  </header>

  <main>
    <h2>Exploring Natural Landscapes</h2>
    <p>Welcome to our showcase of stunning natural environments from around the world. Responsive design allows you to view these breathtaking sights seamlessly across mobile phones, tablets, and large desktop monitors.</p>

    <figure>
      <img src="images/Red.jpeg" alt="Vibrant red autumn forest leaves illuminated by morning sunlight">
      <figcaption class="label">Autumn Red</figcaption>
    </figure>
    <figure>
      <img src="images/Orange.png" alt="Bright orange sunset casting a warm glow over a calm ocean horizon">
      <figcaption class="label">Sunset Orange</figcaption>
    </figure>
    <figure>
      <img src="images/Yellow.png" alt="Golden yellow sunflower field blooming under a bright summer sky">
      <figcaption class="label">Sunflower Yellow</figcaption>
    </figure>
    <figure>
      <img src="images/Green.png" alt="Lush green mountain valley covered in dense pine trees and rolling meadows">
      <figcaption class="label">Valley Green</figcaption>
    </figure>
    <figure>
      <img src="images/Blue.png" alt="Deep blue glacial lake reflecting jagged snowy mountain peaks">
      <figcaption class="label">Glacial Blue</figcaption>
    </figure>
    <figure>
      <img src="images/Indigo.jpeg" alt="Deep indigo night sky filled with bright stars and the Milky Way galaxy">
      <figcaption class="label">Night Sky Indigo</figcaption>
    </figure>
    <figure>
      <img src="images/Purple.png" alt="Vibrant purple lavender field stretching across rolling hills at dusk">
      <figcaption class="label">Lavender Purple</figcaption>
    </figure>
    <figure>
      <img src="images/Pink.jpeg" alt="Soft pink cherry blossoms blooming delicately on tree branches in spring">
      <figcaption class="label">Cherry Blossom Pink</figcaption>
    </figure>
    <figure>
      <img src="images/White.png" alt="Pristine white snow-covered winter landscape with frozen trees">
      <figcaption class="label">Winter White</figcaption>
    </figure>
  </main>

  <footer>
    <a href="#top">Jump to the Top</a>
  </footer>
</body>

</html>
